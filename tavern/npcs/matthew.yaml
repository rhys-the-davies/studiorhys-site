      - name: Aid
        time: 1 action
        range: 30 ft
        duration: 8 hours
        text: Up to three creatures gain +5 to their hit point maximum and current hit points. +5 more per slot level above 2nd.
      - name: Zone of Truth
        time: 1 action
        range: 60 ft
        duration: 10 min
        text: A 15 ft radius sphere. Creatures inside make a DC 13 Charisma save or can't knowingly lie. Matthew knows who failed.
