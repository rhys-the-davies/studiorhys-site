      - name: Protection from Evil and Good
        time: 1 action
        range: Touch
        duration: Up to 10 min
        concentration: true
        text: Aberrations, celestials, elementals, fey, fiends and undead attack the target with disadvantage. The target can't be charmed, frightened or possessed by them.
      - name: Shield of Faith
        time: 1 bonus action
        range: 60 ft
        duration: Up to 10 min
        concentration: true
        text: One creature gains +2 AC.
      - name: Cure Wounds
