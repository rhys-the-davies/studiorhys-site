bonus_actions:
  - name: Lay on Hands
    text: Touch a creature and restore hit points from the Lay on Hands pool. Spending 5 points instead removes the poisoned condition.
  - name: Divine Smite
    text: Right after hitting with a melee attack, spend a spell slot to deal an extra 2d8 radiant damage, plus 1d8 for each slot level above 1st. Add another 1d8 against a fiend or undead.
spellcasting:
